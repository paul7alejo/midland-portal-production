version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        - env | grep -e NHI_SECRET_NAME -e NHI_ENCRYPTION_KEY -e NHI_HASH_SALT -e DYNAMODB_REGION -e COGNITO_PATIENT_USER_POOL_ID -e NEXT_PUBLIC_COGNITO_REGION -e NEXT_PUBLIC_COGNITO_USER_POOL_ID -e NEXT_PUBLIC_COGNITO_CLIENT_ID -e MIDLAND_ACCESS_KEY_ID -e MIDLAND_SECRET_ACCESS_KEY >> .env.production
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
appRoot: /
